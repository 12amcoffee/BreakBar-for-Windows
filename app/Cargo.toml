[package]
name = "breakbar-app"
version = "0.1.0"
edition = "2021"
description = "BreakBar for Windows: floating Pomodoro timer widget"
license = "MIT"

# The program is called BreakBar.exe (not breakbar-app.exe).
[[bin]]
name = "BreakBar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
breakbar-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
# Embeds the page into the exe. Needed for a plain `cargo build --release`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
