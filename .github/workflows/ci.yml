name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p breakbar-core

  windows-app:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p breakbar-app
      - uses: actions/upload-artifact@v4
        with:
          name: BreakBar-windows-exe
          path: target/release/breakbar-app.exe
          if-no-files-found: error
